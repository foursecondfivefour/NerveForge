[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nerveforge"
version = "7.0.1"
description = "Fast, lightweight async bridge between Arena.ai Agent Mode and local PC (Linux, Windows, Unity)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "DRCerg & NerveForge Contributors" }]
requires-python = ">=3.10"
keywords = ["arena-ai", "agent-mode", "bridge", "unity", "terminal", "cloudflare", "tailscale", "developer-tools", "ai-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/drcerg/nerveforge"
Documentation = "https://github.com/drcerg/nerveforge#readme"
Issues = "https://github.com/drcerg/nerveforge/issues"

[project.scripts]
nerveforge = "nerveforge.tunnel:main"

[tool.setuptools.packages.find]
where = ["src"]
